<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // 1、服务端返回响应头：Content-Type: text/event-stream
    // 2、以 ReadableStream 为 body 返回Response
    // 3、用 ReadableStreamDefaultController 的 enqueue 向 body 中不断写入数据，结束时 close
    // 4、前端读取

    // 模拟数据
    function s(text) {
      return new Promise((resolve) => {
        setTimeout(() => {
          resolve(text)
        }, 1000);
      })
    }
    function* myItemrator() {
      yield s('H')
      yield s('E')
      yield s('L')
      yield s('L')
      yield s('O')
      yield s('!')
    }
    // 创建可读流和stream
    let controller = null
    let readableStream = new ReadableStream({
      start(ctrl) {
        controller = ctrl
      },
      // async pull(controller) {
      //   const { value, done } = await iterator.next();
      //   if (done) {
      //     controller.close();
      //   } else {
      //     controller.enqueue(value);
      //   }
      // },
    });
    async function pushStream(params) {
      const iterator = myItemrator()
      for await (const v of iterator) {
        controller.enqueue(v)
      }
      controller.close()
    }

    // 模拟前端读取
    const request = async () => {
      const reader = readableStream.getReader()
      while (true) {
        let {done, value} =  await reader.read()
        if (done) break
        console.log(value)
      }
      console.log('DONE!')
    }

    pushStream()
    request()
  </script>
</body>
</html>
