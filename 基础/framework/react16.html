<body>
  <script>
    // 生成一个React 16 fiber树结构
    let fiberRoot = {
      return: null,
      child: {
        return: fiberRoot,
        sibling: {
          return: fiberRoot,
          child: null,
          sibling: null
        },
        child: {
          return: fiberRoot.child,
          child: null,
          sibling: {
            return: fiberRoot.child,
            child: null,
            sibling: null
          }
        }
      }
    }
  </script>
</body>
