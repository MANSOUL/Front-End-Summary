<!DOCTYPE html>
<html lang="en">
<head>

<body>
  <script>
    /**
     * 为什么需要key
     * [A, B, C] => [A, C, B]
     * 如果没有key, React和Vue采用复用策略，B修改为C，C修改为B，需要修改两次
     * 有key，A不需要修改，B和C只需要移动即可
    */

    /**
     * 为什么不用index作为key
     * [A, B, C] => [D, A, B, C]
     * 如果用index作为key，则认为A和D、B和A、C和B是同一个元素，修改三次；之后新建C插入
     * 有唯一key的话，只需要创建D并插入即可
     * */

    // react
    /**
     * React diff算法
     * 同级比较，类型不同则销毁重建
     * 列表比较采用仅右移算法
     * 设置visitedOldMaxIndex 为访问过的老集合的最大下标
     * 当元素在旧列表中的索引小于visitedOldMaxIndex时，说明该元素需要移动，则移动到visitedOldMaxIndex的位置
     * [A，B，C，D] => [A，D，B，C]
     * 遍历新旧列表，发现A相同，不动，visitedOldMaxIndex = 0
     * 继续遍历，D和B不同，且D旧索引 3 > visitedOldMaxIndex，不动，更新visitedOldMaxIndex = 3；
     * 继续遍历，B和C不同，且B旧索引 1 < visitedOldMaxIndex，移动B；
     * 继续遍历，C和D不同，且C旧索引 2 < visitedOldMaxIndex，移动C；
     */
    let oldList = ['A', 'B', 'C', 'D'];
    // let newList = ['A', 'D', 'B', 'C'];
    // let newList = ['C', 'A', 'B', 'D'];
    // let newList = ['D', 'C', 'B', 'A'];
    let newList = ['D', 'C', 'E', 'B'];
    let patchs = []
    let visitedOldMaxIndex = 0; // 访问过的老集合的最大下标
    for (let i = 0; i < newList.length; i++) {
      const element = newList[i];
      let oldIndex = oldList.indexOf(element);
      if (oldIndex === -1) {
        console.log(`元素${element}需要创建`);
        oldList.splice(visitedOldMaxIndex + 1, 0, element);
        console.log(JSON.stringify(oldList));
        oldIndex = visitedOldMaxIndex + 1;
      } else
      if (visitedOldMaxIndex > oldIndex) {
        console.log(`元素${element}需要移动`);
        oldList.splice(visitedOldMaxIndex, 0, oldList.splice(oldIndex, 1)[0]);
        console.log(JSON.stringify(oldList));
      }
      visitedOldMaxIndex = Math.max(visitedOldMaxIndex, oldIndex);
    }
    // 遍历老列表，删除新列表中不存在的元素
    for (let i = 0; i < oldList.length; i++) {
      const element = oldList[i];
      if (newList.indexOf(element) === -1) {
        console.log(`元素${element}需要删除`);
        oldList.splice(i, 1);
        i--;
      }
    }
    console.log(oldList);

    /**
     * Vue diff算法
     * 采用双端比较算法，头尾指针同时向中间移动
     * 
     */
  </script>
</body>
</html>
