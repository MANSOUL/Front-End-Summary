<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // 类似于选择排序的暴力变体
    function bbsort(arr) {
      let len = arr.length
      for (let i = 0; i < len; i++) {
        for (let j = 0; j < len; j++) {
          if (arr[i] < arr[j]) {
            let temp = arr[i]
            arr[i] = arr[j]
            arr[j] = temp
          }
        }
      }
      return arr
    }

    // 冒泡排序
    function bubbleSort(arr) {
      const len = arr.length
      for (let i = 0; i < len - 1; i++) {
        for (let j = 0; j < len - 1 - i; j++) {
          if (arr[j] > arr[j + 1]) {
            let temp = arr[j]
            arr[j] = arr[j + 1]
            arr[j + 1] = temp
          }
        }
      }
      return arr
    }

    console.log(bubbleSort([11, 3, 4, 45, 89, 1, 10, 9, 23, 34, 2, 8]))

    // 快排：分治+递归，非原地版本
    function quickSort(arr) {
      let left = []
      let right = []
      let ele = arr[0]
      if (arr.length <= 1) return arr
      for (let i = 1; i < arr.length; i++) {
        if (ele > arr[i]) {
          left.push(arr[i])
        } else {
          right.push(arr[i])
        }
      }
      return [...quickSort(left), ele, ...quickSort(right)]
    }

    console.log(quickSort([11, 3, 4, 45, 89, 1, 10, 9, 23, 34, 2, 8]))
  </script>
</body>
</html>
